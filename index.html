<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar e Controle Futsal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            background: black; 
            color: white; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            overflow: hidden; 
            transition: background-color 0.2s; 
            font-family: sans-serif;
        }

        /* Animação de piscar */
        @keyframes piscar {
            0% { background-color: red; }
            50% { background-color: black; }
            100% { background-color: red; }
        }

        .piscar-vermelho {
            animation: piscar 0.5s infinite;
        }

        /* Área do Display */
        #display-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #display { 
            font-size: 28vw; 
            font-family: 'Courier New', monospace; 
            font-weight: bold;
            line-height: 1;
            user-select: none;
        }

        /* Área dos Botões de Controle */
        #controles {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
            padding-bottom: 10px;
        }

        button {
            flex: 1;
            padding: 20px 10px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px #1a252f;
        }

        .btn-iniciar { background-color: #27ae60; } /* Verde */
        .btn-pausar { background-color: #f39c12; }  /* Laranja */
        .btn-mais { background-color: #2980b9; }    /* Azul */
        .btn-reset { background-color: #c0392b; }   /* Vermelho */

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px #1a252f;
            filter: brightness(0.8);
        }
    </style>
</head>
<body>

    <!-- PAINEL DO PLACAR -->
    <div id="display-container">
        <div id="display">10:00</div>
    </div>
    
    <audio id="somSirene" src="Apito.mp3"></audio>

    <!-- PAINEL DE CONTROLE -->
    <div id="controles">
        <button class="btn-iniciar" onclick="enviar('iniciar')">INICIAR</button>
        <button class="btn-pausar" onclick="enviar('pausar')">PAUSAR</button>
        <button class="btn-mais" onclick="enviar('acrescentar1')">+1 MIN</button>
        <button class="btn-reset" onclick="enviar('resetar')">RESETAR</button>
    </div>

    <script>
        let socket;
        try {
            socket = io();
        } catch(e) {
            console.log("Socket.io não carregado ou rodando local sem servidor.");
        }

        const sirene = document.getElementById('somSirene');
        const display = document.getElementById('display');
        let tempo = 600; // 10 minutos em segundos
        let rodando = false;
        let timer;
        let somAutorizado = false;

        // Liberar áudio e Fullscreen no primeiro clique em qualquer lugar
        function autorizarAudio() {
            if (!somAutorizado && sirene) {
                sirene.play().then(() => {
                    sirene.pause();
                    sirene.currentTime = 0;
                    somAutorizado = true;

                    if ('wakeLock' in navigator) {
                        navigator.wakeLock.request('screen')
                            .then(() => console.log("Tela trancada: Não vai apagar!"))
                            .catch(err => console.log("Erro ao manter tela ativa:", err));
                    }
                }).catch(e => console.log("Aguardando interação:", e));
            }
        }
        document.body.addEventListener('click', autorizarAudio, { once: true });

        function atualizarDisplay() {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }

        // Executa a lógica de cada comando
        function executarComando(cmd) {
            // INICIAR
            if (cmd === 'iniciar' && !rodando) {
                rodando = true;

                if (sirene) { sirene.play().catch(e => console.log(e)); }

                timer = setInterval(() => {
                    if (tempo > 0) {
                        tempo--;
                        atualizarDisplay();
                    } else {
                        clearInterval(timer);
                        rodando = false;

                        if (sirene) { sirene.play().catch(e => console.log(e)); }

                        document.body.classList.add('piscar-vermelho');

                        setTimeout(() => { 
                            document.body.classList.remove('piscar-vermelho');
                            document.body.style.backgroundColor = "black";
                        }, 5000);
                    }
                }, 1000);
            }

            // PAUSAR
            if (cmd === 'pausar' && rodando) {
                clearInterval(timer);
                rodando = false;
            }

            // RESETAR ou ACRESCENTAR 1 MIN
            if (cmd === 'resetar' || cmd === 'acrescentar1') {
                if (sirene) { sirene.pause(); sirene.currentTime = 0; }
                document.body.classList.remove('piscar-vermelho');

                if (cmd === 'resetar') { 
                    tempo = 600; 
                    clearInterval(timer); 
                    rodando = false; 
                }

                if (cmd === 'acrescentar1') { 
                    tempo += 60; 
                }

                atualizarDisplay();
                document.body.style.backgroundColor = "black";
            }
        }

        // Envia o comando
        function enviar(cmd) {
            // Executa localmente de imediato
            executarComando(cmd);

            // Emite para o servidor Socket se estiver conectado
            if (socket) {
                socket.emit('comando', cmd);
            }
        }

        // Recebe comandos (se houver outro controle externo conectado)
        if (socket) {
            socket.on('comando', (cmd) => {
                executarComando(cmd);
            });
        }
    </script>
</body>
</html>
