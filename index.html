<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Placar Futsal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: black; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; font-family: sans-serif; transition: background-color 0.2s; }
        @keyframes piscar { 0% { background-color: red; } 50% { background-color: black; } 100% { background-color: red; } }
        .piscar-vermelho { animation: piscar 0.5s infinite; }

        #display-container { flex: 1; display: flex; align-items: center; justify-content: center; }
        #display { font-size: 28vw; font-family: 'Courier New', monospace; font-weight: bold; }

        #controles { display: flex; gap: 15px; padding: 20px; justify-content: center; }
        button { flex: 1; padding: 20px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 6px #1a252f; }
        .btn-iniciar { background-color: #27ae60; color: white; }
        .btn-pausar { background-color: #f39c12; color: white; }
        .btn-mais { background-color: #2980b9; color: white; }
        .btn-reset { background-color: #c0392b; color: white; }
    </style>
</head>
<body>

    <div id="display-container"><div id="display">10:00</div></div>
    <audio id="somSirene" src="Apito.mp3"></audio>

    <div id="controles">
        <button class="btn-iniciar" onclick="enviar('iniciar')">INICIAR</button>
        <button class="btn-pausar" onclick="enviar('pausar')">PAUSAR</button>
        <button class="btn-mais" onclick="enviar('acrescentar1')">+1 MIN</button>
        <button class="btn-reset" onclick="enviar('resetar')">RESETAR</button>
    </div>

    <script>
        const socket = io();
        const sirene = document.getElementById('somSirene');
        const display = document.getElementById('display');
        let tempo = 600; 
        let rodando = false;
        let timer;

        function atualizarDisplay() {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }

        function executarComando(cmd) {
            // Lógica do INICIAR
            if (cmd === 'iniciar' && !rodando) {
                rodando = true;
                if (sirene) sirene.play().catch(e => console.log(e));
                
                // Tenta entrar em Fullscreen ao iniciar
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }

                timer = setInterval(() => {
                    if (tempo > 0) {
                        tempo--;
                        atualizarDisplay();
                    } else {
                        clearInterval(timer);
                        rodando = false;
                        if (sirene) sirene.play().catch(e => console.log(e));
                        document.body.classList.add('piscar-vermelho');
                        setTimeout(() => { document.body.classList.remove('piscar-vermelho'); }, 5000);
                    }
                }, 1000);
            }

            // Lógica do PAUSAR
            if (cmd === 'pausar' && rodando) {
                clearInterval(timer);
                rodando = false;
            }

            // Lógica do RESETAR / +1 MIN
            if (cmd === 'resetar' || cmd === 'acrescentar1') {
                if (sirene) { sirene.pause(); sirene.currentTime = 0; }
                document.body.classList.remove('piscar-vermelho');

                if (cmd === 'resetar') { tempo = 600; clearInterval(timer); rodando = false; }
                if (cmd === 'acrescentar1') { tempo += 60; }
                
                atualizarDisplay();
            }
        }

        // Nova estratégia: Apenas o Socket dispara a ação. 
        // Quem clica apenas "avisa" ao servidor que quer executar.
        function enviar(cmd) {
            socket.emit('comando', cmd);
        }

        // O comando só é executado quando chega via socket
        socket.on('comando', (cmd) => {
            executarComando(cmd);
        });
    </script>
</body>
</html>
