<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Futsal - Gigante e Brilhante</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            background: black; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif;
            transition: background-color 0.2s; 
        }

        /* Animação de piscar com fundo vermelho */
        @keyframes piscar {
            0% { background-color: #ff0000; }
            50% { background-color: #000000; }
            100% { background-color: #ff0000; }
        }

        .piscar-vermelho {
            animation: piscar 0.5s infinite;
        }

        /* Container central do placar */
        #display-container { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
            overflow: hidden;
        }

        /* Números gigantes com efeito neon ultra brilhante */
        #display { 
            font-size: 70vh; 
            font-family: 'Arial Black', Impact, sans-serif; 
            font-weight: 900; 
            line-height: 0.85; 
            letter-spacing: -8px; 
            user-select: none;
            text-align: center;
            color: #ffffff;
            /* Camadas de sombra intensa simulando iluminação forte */
            text-shadow: 
                0 0 10px #ffffff,
                0 0 20px #ffffff,
                0 0 40px #ffff00,
                0 0 80px #ffff00,
                0 0 120px #ffcc00,
                0 0 160px #ffcc00;
        }

        /* Rodapé de controles */
        #controles { 
            display: flex; 
            gap: 10px; 
            padding: 10px 15px; 
            background: #111; 
            width: 100%;
            z-index: 10;
        }

        button { 
            flex: 1; 
            padding: 15px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.1s;
            box-shadow: 0 4px #000;
        }

        .btn-iniciar { background-color: #27ae60; }
        .btn-pausar { background-color: #f39c12; }
        .btn-mais { background-color: #2980b9; }
        .btn-reset { background-color: #c0392b; }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px #000;
            filter: brightness(0.8);
        }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="display">10:00</div>
    </div>
    
    <audio id="somSirene" src="Apito.mp3"></audio>

    <div id="controles">
        <button class="btn-iniciar" onclick="enviar('iniciar')">INICIAR</button>
        <button class="btn-pausar" onclick="enviar('pausar')">PAUSAR</button>
        <button class="btn-mais" onclick="enviar('acrescentar1')">+1 MIN</button>
        <button class="btn-reset" onclick="enviar('resetar')">RESETAR</button>
    </div>

    <script>
        const socket = io();
        const sirene = document.getElementById('somSirene');
        const display = document.getElementById('display');
        let tempo = 600; 
        let rodando = false;
        let timer;

        function atualizarDisplay() {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
        }

        function executarComando(cmd) {
            // INICIAR
            if (cmd === 'iniciar' && !rodando) {
                rodando = true;
                if (sirene) sirene.play().catch(e => console.log(e));
                
                // Ativa Tela Cheia
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }

                // Pisca a tela em vermelho por 10 segundos no início
                document.body.classList.add('piscar-vermelho');
                setTimeout(() => {
                    document.body.classList.remove('piscar-vermelho');
                    document.body.style.backgroundColor = "black";
                }, 10000);

                timer = setInterval(() => {
                    if (tempo > 0) {
                        tempo--;
                        atualizarDisplay();
                    } else {
                        clearInterval(timer);
                        rodando = false;

                        if (sirene) sirene.play().catch(e => console.log(e));

                        // Pisca a tela em vermelho por 10 segundos quando o cronômetro ZERA
                        document.body.classList.add('piscar-vermelho');
                        setTimeout(() => { 
                            document.body.classList.remove('piscar-vermelho');
                            document.body.style.backgroundColor = "black";
                        }, 10000);
                    }
                }, 1000);
            }

            // PAUSAR
            if (cmd === 'pausar' && rodando) {
                clearInterval(timer);
                rodando = false;
            }

            // RESETAR ou ACRESCENTAR 1 MIN
            if (cmd === 'resetar' || cmd === 'acrescentar1') {
                if (sirene) { sirene.pause(); sirene.currentTime = 0; }
                document.body.classList.remove('piscar-vermelho');

                if (cmd === 'resetar') { 
                    tempo = 600; 
                    clearInterval(timer); 
                    rodando = false; 
                }

                if (cmd === 'acrescentar1') { 
                    tempo += 60; 
                }
                
                atualizarDisplay();
                document.body.style.backgroundColor = "black";
            }
        }

        // Envia o comando via Socket
        function enviar(cmd) {
            socket.emit('comando', cmd);
        }

        // Recebe o comando via Socket
        socket.on('comando', (cmd) => {
            executarComando(cmd);
        });
    </script>
</body>
</html>
