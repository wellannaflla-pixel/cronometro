<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Placar Futsal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            background: black; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            transition: background-color 0.2s; 
        }

        /* Animação de piscar */
        @keyframes piscar {
            0% { background-color: red; }
            50% { background-color: black; }
            100% { background-color: red; }
        }

        .piscar-vermelho {
            animation: piscar 0.5s infinite;
        }

        #display { 
            font-size: 40vw; 
            font-family: 'Courier New', monospace; 
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="display">10:00</div>
    <audio id="somSirene" src="Apito.mp3"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const socket = io();
            const sirene = document.getElementById('somSirene');
            const display = document.getElementById('display');
            let tempo = 600; // 10 minutos em segundos
            let rodando = false;
            let timer;
            let somAutorizado = false;

            // Função para liberar o som no navegador
            function autorizarAudio() {
                if (!somAutorizado && sirene) {
                    sirene.play().then(() => {
                        sirene.pause();
                        sirene.currentTime = 0;
                        somAutorizado = true;
                        document.body.removeEventListener('click', autorizarAudio);

                        if (!document.fullscreenElement) {
                            document.documentElement.requestFullscreen().catch(err => console.log(err));
                        }

                        if ('wakeLock' in navigator) {
                            navigator.wakeLock.request('screen')
                                .then(() => console.log("Tela trancada: Não vai apagar!"))
                                .catch(err => console.log("Erro ao manter tela ativa:", err));
                        }
                    }).catch(e => console.log("Aguardando interação:", e));
                }
            }
            document.body.addEventListener('click', autorizarAudio);

            function atualizarDisplay() {
                let m = Math.floor(tempo / 60);
                let s = tempo % 60;
                display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }

            // Recebe os comandos do controle
            socket.on('comando', (cmd) => {
                
                // INICIAR
                if (cmd === 'iniciar' && !rodando) {
                    rodando = true;

                    if (sirene) { sirene.play().catch(e => console.log(e)); }

                    timer = setInterval(() => {
                        if (tempo > 0) {
                            tempo--;
                            atualizarDisplay();
                        } else {
                            clearInterval(timer);
                            rodando = false;
                            
                            if (sirene) { sirene.play().catch(e => console.log(e)); }
                            
                            document.body.classList.add('piscar-vermelho');
                            
                            setTimeout(() => { 
                                document.body.classList.remove('piscar-vermelho');
                                document.body.style.backgroundColor = "black";
                            }, 5000);
                        }
                    }, 1000);
                }

                // PAUSAR
                if (cmd === 'pausar' && rodando) {
                    clearInterval(timer);
                    rodando = false;
                }
                
                // RESETAR ou ACRESCENTAR 1 MIN
                if (cmd === 'resetar' || cmd === 'acrescentar1') {
                    if (sirene) { sirene.pause(); sirene.currentTime = 0; }
                    document.body.classList.remove('piscar-vermelho');
                    
                    if (cmd === 'resetar') { 
                        tempo = 600; 
                        clearInterval(timer); 
                        rodando = false; 
                    }
                    
                    if (cmd === 'acrescentar1') { 
                        tempo += 60; 
                    }
                    
                    atualizarDisplay();
                    document.body.style.backgroundColor = "black";
                }
            });
        });
    </script>
</body>
</html>
