<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            background: black; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif;
            transition: background-color 0.2s; 
            cursor: pointer;
        }

        /* Animação de piscar com fundo vermelho */
        @keyframes piscar {
            0% { background-color: #ff0000; }
            50% { background-color: #000000; }
            100% { background-color: #ff0000; }
        }

        .piscar-vermelho {
            animation: piscar 0.5s infinite;
        }

        #display-container { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
            overflow: hidden;
        }

        /* Números gigantes */
        #display { 
            font-size: 82vh; 
            font-family: 'Arial Black', Impact, sans-serif; 
            font-weight: 900; 
            line-height: 0.8; 
            letter-spacing: -12px; 
            user-select: none;
            text-align: center;
            color: #ffffff;
            text-shadow: 
                0 0 5px #ffffff,
                0 0 15px #04fa04,
                0 0 30px #04fa04;
        }

        .display-verde {
            text-shadow: 0 0 5px #ffffff, 0 0 15px #04fa04, 0 0 30px #04fa04;
        }

        .display-amarelo {
            text-shadow: 0 0 5px #ffffff, 0 0 15px #f5d300, 0 0 30px #f5d300;
        }

        .display-vermelho {
            text-shadow: 0 0 5px #ffffff, 0 0 15px #ff2a2a, 0 0 30px #ff2a2a;
        }

        #controles { 
            display: flex; 
            gap: 6px; 
            padding: 5px 8px; 
            background: #0a0a0a; 
            width: 100%;
            z-index: 10;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        /* Oculta os botões quando ativado */
        .ocultar-controles {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        button { 
            flex: 1; 
            padding: 8px 4px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: transform 0.05s, filter 0.05s;
            box-shadow: 0 2px #000;
            touch-action: manipulation;
        }

        .btn-iniciar { background-color: #27ae60; }
        .btn-pausar { background-color: #f39c12; }
        .btn-mais { background-color: #2980b9; }
        .btn-reset { background-color: #c0392b; }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
            filter: brightness(0.8);
        }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="display">10:00</div>
    </div>
    
    <audio id="somSirene" src="Apito.mp3"></audio>

    <div id="controles">
        <button class="btn-iniciar" onmousedown="enviar('iniciar', event)" ontouchstart="enviar('iniciar', event)">INICIAR</button>
        <button class="btn-pausar" onmousedown="enviar('pausar', event)" ontouchstart="enviar('pausar', event)">PAUSAR</button>
        <button class="btn-mais" onmousedown="enviar('acrescentar1', event)" ontouchstart="enviar('acrescentar1', event)">+1 MIN</button>
        <button class="btn-reset" onmousedown="enviar('resetar', event)" ontouchstart="enviar('resetar', event)">RESETAR</button>
    </div>

    <script>
        const socket = io();
        const sirene = document.getElementById('somSirene');
        const display = document.getElementById('display');
        const controles = document.getElementById('controles');
        let tempo = 600; 
        let rodando = false;
        let timer;

        function atualizarCorDisplay() {
            if (tempo >= 360) {
                display.style.textShadow = '0 0 5px #ffffff, 0 0 15px #04fa04, 0 0 30px #04fa04';
            } else if (tempo >= 180) {
                display.style.textShadow = '0 0 5px #ffffff, 0 0 15px #f5d300, 0 0 30px #f5d300';
            } else {
                display.style.textShadow = '0 0 5px #ffffff, 0 0 15px #ff2a2a, 0 0 30px #ff2a2a';
            }
        }

        function atualizarDisplay() {
            let m = Math.floor(tempo / 60);
            let s = tempo % 60;
            display.innerText = `${m}:${s < 10 ? '0'+s : s}`;
            atualizarCorDisplay();
        }

        // Alterna a visibilidade dos botões ao clicar em qualquer lugar fora dos botões
        document.body.addEventListener('click', (e) => {
            if (!controles.contains(e.target)) {
                controles.classList.toggle('ocultar-controles');
            }
        });

        function executarComando(cmd) {
            // INICIAR
            if (cmd === 'iniciar' && !rodando) {
                rodando = true;
                if (sirene) sirene.play().catch(e => console.log(e));
                
                // Entra em tela cheia
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }

                // Esconde os botões após iniciar
                controles.classList.add('ocultar-controles');

                // Pisca a tela em vermelho por 10s no início
                document.body.classList.add('piscar-vermelho');
                setTimeout(() => {
                    document.body.classList.remove('piscar-vermelho');
                    document.body.style.backgroundColor = "black";
                }, 10000);

                timer = setInterval(() => {
                    if (tempo > 0) {
                        tempo--;
                        atualizarDisplay();
                    } else {
                        clearInterval(timer);
                        rodando = false;

                        if (sirene) sirene.play().catch(e => console.log(e));

                        // Pisca a tela em vermelho por 10s ao zerar
                        document.body.classList.add('piscar-vermelho');
                        setTimeout(() => { 
                            document.body.classList.remove('piscar-vermelho');
                            document.body.style.backgroundColor = "black";
                        }, 10000);
                    }
                }, 1000);
            }

            // PAUSAR
            if (cmd === 'pausar' && rodando) {
                clearInterval(timer);
                rodando = false;
            }

            // RESETAR / +1 MIN
            if (cmd === 'resetar' || cmd === 'acrescentar1') {
                if (sirene) { sirene.pause(); sirene.currentTime = 0; }
                document.body.classList.remove('piscar-vermelho');

                if (cmd === 'resetar') { 
                    tempo = 600; 
                    clearInterval(timer); 
                    rodando = false; 
                    controles.classList.remove('ocultar-controles');
                }

                if (cmd === 'acrescentar1') { 
                    tempo += 60; 
                }
                
                atualizarDisplay();
                document.body.style.backgroundColor = "black";
            }
        }

        // Envia o comando tratando o evento para não se propagar
        function enviar(cmd, e) {
            if (e) {
                e.stopPropagation();
                if (e.type === 'touchstart') e.preventDefault();
            }
            socket.emit('comando', cmd);
        }

        // Recebe o comando via Socket
        socket.on('comando', (cmd) => {
            executarComando(cmd);
        });
    </script>
</body>
</html>
